# BioFace AI - Docker Compose
#
# Sobe API (FastAPI) + Dashboard (Streamlit) em containers.
# O pipeline de câmera roda FORA do Docker, direto no host.
#
# Por quê? Docker no Windows não acessa webcam diretamente.
# Separar também reduz latência no processamento de frames.
#
# ─────────────────────────────────────────────
#  COMO USAR
# ─────────────────────────────────────────────
#
#  1. Sobe os serviços:
#       docker-compose up --build
#
#  2. Em outro terminal, inicia o pipeline de câmera:
#       python main-light.py --api-url http://localhost:8000
#
#  3. Acesse:
#       API docs  → http://localhost:8000/docs
#       Dashboard → http://localhost:8501
#
# ─────────────────────────────────────────────

services:

  # ── API FastAPI ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bioface-api
    image: bioface-api:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./bioface.db
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    volumes:
      - ./bioface.db:/app/bioface.db   # banco compartilhado com o host
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bioface-network

  # ── Dashboard Streamlit ──────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: bioface-dashboard
    image: bioface-dashboard:latest
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bioface-network

networks:
  bioface-network:
    driver: bridge
